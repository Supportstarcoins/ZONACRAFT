name: Build Universal Armor Boot Ground Fix

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'armor_boot_ground_fix/**'
      - '.github/workflows/build-armor-boot-ground-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Create compile-only Forge 1.6.4 stubs
        shell: bash
        run: |
          set -euo pipefail
          S=armor_boot_ground_fix/build/stubs
          mkdir -p "$S/cpw/mods/fml/common/event" \
                   "$S/cpw/mods/fml/common" \
                   "$S/net/minecraftforge/common" \
                   "$S/net/minecraftforge/event" \
                   "$S/net/minecraftforge/client/event" \
                   "$S/net/minecraft/entity" \
                   "$S/org/lwjgl/opengl"

          cat > "$S/cpw/mods/fml/common/Mod.java" <<'EOF'
          package cpw.mods.fml.common;
          import java.lang.annotation.*;
          @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.TYPE)
          public @interface Mod {
              String modid(); String name() default ""; String version() default "";
              String dependencies() default ""; String acceptedMinecraftVersions() default "";
              @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.METHOD)
              public @interface EventHandler {}
          }
          EOF

          cat > "$S/cpw/mods/fml/common/SidedProxy.java" <<'EOF'
          package cpw.mods.fml.common;
          import java.lang.annotation.*;
          @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.FIELD)
          public @interface SidedProxy { String clientSide(); String serverSide(); }
          EOF

          cat > "$S/cpw/mods/fml/common/event/FMLInitializationEvent.java" <<'EOF'
          package cpw.mods.fml.common.event;
          public class FMLInitializationEvent {}
          EOF

          cat > "$S/cpw/mods/fml/common/event/FMLPreInitializationEvent.java" <<'EOF'
          package cpw.mods.fml.common.event;
          import java.io.File;
          public class FMLPreInitializationEvent {
              public File getModConfigurationDirectory() { return new File("config"); }
          }
          EOF

          cat > "$S/net/minecraftforge/event/EventPriority.java" <<'EOF'
          package net.minecraftforge.event;
          public enum EventPriority { HIGHEST, HIGH, NORMAL, LOW, LOWEST }
          EOF

          cat > "$S/net/minecraftforge/event/ForgeSubscribe.java" <<'EOF'
          package net.minecraftforge.event;
          import java.lang.annotation.*;
          @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.METHOD)
          public @interface ForgeSubscribe {
              EventPriority priority() default EventPriority.NORMAL;
              boolean receiveCanceled() default false;
          }
          EOF

          cat > "$S/net/minecraftforge/event/EventBus.java" <<'EOF'
          package net.minecraftforge.event;
          public class EventBus { public void register(Object value) {} }
          EOF

          cat > "$S/net/minecraftforge/common/MinecraftForge.java" <<'EOF'
          package net.minecraftforge.common;
          import net.minecraftforge.event.EventBus;
          public final class MinecraftForge {
              public static final EventBus EVENT_BUS = new EventBus();
          }
          EOF

          cat > "$S/net/minecraft/entity/EntityLivingBase.java" <<'EOF'
          package net.minecraft.entity;
          public class EntityLivingBase {}
          EOF

          cat > "$S/net/minecraftforge/client/event/RenderLivingEvent.java" <<'EOF'
          package net.minecraftforge.client.event;
          import net.minecraft.entity.EntityLivingBase;
          public class RenderLivingEvent {
              public EntityLivingBase entity;
              public static class Pre extends RenderLivingEvent {}
              public static class Post extends RenderLivingEvent {}
          }
          EOF

          cat > "$S/org/lwjgl/opengl/GL11.java" <<'EOF'
          package org.lwjgl.opengl;
          public final class GL11 {
              public static void glTranslatef(float x, float y, float z) {}
          }
          EOF

      - name: Compile Java 7 compatible mod
        shell: bash
        run: |
          set -euo pipefail
          P=armor_boot_ground_fix
          rm -rf "$P/build/classes" "$P/build/jar" "$P/release"
          mkdir -p "$P/build/classes" "$P/build/jar" "$P/release"
          find "$P/build/stubs" "$P/src" -name '*.java' -print > "$P/build/sources.txt"
          javac -source 1.7 -target 1.7 -encoding UTF-8 -Xlint:unchecked \
            -d "$P/build/classes" @"$P/build/sources.txt"

          mkdir -p "$P/build/jar/ru"
          cp -R "$P/build/classes/ru/zonecraft" "$P/build/jar/ru/"
          cp "$P/resources/mcmod.info" "$P/build/jar/mcmod.info"

          JAR="$P/release/Zonecraft-Universal-Armor-Boot-Ground-Fix-1.6.4-1.0.0.jar"
          (cd "$P/build/jar" && jar cfm "../../release/$(basename "$JAR")" "../../MANIFEST.MF" .)

          test "$(unzip -p "$JAR" ru/zonecraft/armorbootfix/ArmorBootGroundFixMod.class | od -An -t u1 -N 8 | awk '{print $8}')" = "51"
          unzip -t "$JAR"
          jar tf "$JAR" | grep -q 'BootGroundRenderEvents.class'
          jar tf "$JAR" | grep -q 'SuitDetector.class'
          if jar tf "$JAR" | grep -qE '^(cpw/|net/|org/lwjgl/)'; then
            echo 'Compile stubs leaked into runtime JAR' >&2
            exit 1
          fi

          cp "$P/README_RU.md" "$P/release/README_RU.md"
          (cd "$P/release" && zip -9 "Zonecraft-Universal-Armor-Boot-Ground-Fix-1.6.4-1.0.0.zip" \
            "Zonecraft-Universal-Armor-Boot-Ground-Fix-1.6.4-1.0.0.jar" README_RU.md)

      - name: Upload boot fix
        uses: actions/upload-artifact@v4
        with:
          name: Zonecraft-Universal-Armor-Boot-Ground-Fix-1.6.4-1.0.0
          path: armor_boot_ground_fix/release/Zonecraft-Universal-Armor-Boot-Ground-Fix-1.6.4-1.0.0.zip
          if-no-files-found: error
