name: Package Full Blender GLB Exporter

on:
  push:
    branches:
      - chatgpt/blender-glb-exporter-0.4.3-fixed
  pull_request:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check full exporter
        run: python3 -m py_compile tools/blender_stalcraft_glb_export_0.4.3_FULL_FIXED.py
      - name: Show file size
        run: ls -lh tools/blender_stalcraft_glb_export_0.4.3_FULL_FIXED.py
      - name: Upload full standalone exporter
        uses: actions/upload-artifact@v4
        with:
          name: blender_stalcraft_glb_export_0.4.3_FULL_FIXED
          path: tools/blender_stalcraft_glb_export_0.4.3_FULL_FIXED.py
          if-no-files-found: error
